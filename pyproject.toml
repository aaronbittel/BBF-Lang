[project]
name = "bbf"
version = "0.1.0"
description = "Compiler for BBF-Lang written in Python"
readme = "README.md"
authors = [
    { name = "Aaron Bittel", email = "aaron@bittels.de" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
bbf = "bbf:main.main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E731"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
pythonpath = ["src"]
